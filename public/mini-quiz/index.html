<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Which Daughter Are You? A mini quiz by Kingdom Roe Coaching & Consulting.">
<title>Which Daughter Are You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one centered column on the black stage of the cover art; three pages unlock in order. Single deliberate dark look. */
:root{
  --ink:#0b0708; --panel:#160c0b; --panel-2:#1f1110;
  --pink:#d64492; --pink-deep:#b0326f; --pink-soft:rgba(214,68,146,.16);
  --cream:#f3decd; --cream-dim:#cdb8aa; --gold:#c9a45c; --line:rgba(243,222,205,.14);
  --display:"Cormorant Garamond", Garamond, "Times New Roman", serif;
  --body:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding-block:20px 8px}
.step{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);opacity:.45;padding:6px 10px;border-radius:999px;border:1px solid transparent}
.step svg{width:12px;height:12px;fill:currentColor}
.step.done{opacity:.85}
.step.current{opacity:1;color:var(--pink);border-color:var(--pink)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink-deep),var(--pink));transition:width .35s ease}
.cover{display:grid;gap:18px;justify-items:center;text-align:center;padding-block:20px 0}
.cover img{display:block;width:100%;max-width:520px;border-radius:8px;box-shadow:0 0 60px rgba(214,68,146,.25)}
.inside{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left;max-width:440px}
.inside li{padding-left:22px;position:relative;color:var(--cream-dim);font-size:15px}
.inside li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px;width:100%;max-width:460px;text-align:left}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;letter-spacing:.04em}
input[type=email]{width:100%;background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit}
input:focus{border-color:var(--pink);outline:none}
.err{color:#ff8fb8;font-size:13px;min-height:1em}
.btn{appearance:none;border:0;border-radius:999px;padding:14px 26px;font:600 15px/1.2 var(--body);letter-spacing:.02em;cursor:pointer;background:var(--pink);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .2s}
.btn:hover{background:var(--pink-deep)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row.between{justify-content:space-between}
.page{padding-block:24px 0;display:grid;gap:18px}
.page h2{font-size:clamp(32px,6vw,46px);color:var(--pink)}
.lede{font-family:var(--display);font-style:italic;font-size:clamp(19px,3.6vw,23px);line-height:1.4}
.copy{display:grid;gap:14px;max-width:65ch}
.copy ol{margin:0;padding-left:20px;display:grid;gap:8px}
.qnum{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-dim)}
.qtext{font-family:var(--display);font-size:clamp(24px,4.6vw,32px);font-weight:600;color:var(--cream)}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font:15px/1.45 var(--body);cursor:pointer;transition:border-color .2s,background .2s}
.choice:hover{border-color:var(--cream-dim)}
.choice[aria-pressed=true]{border-color:var(--pink);background:var(--pink-soft)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--cream-dim)}
.choice[aria-pressed=true] .k{background:var(--pink);border-color:var(--pink);color:#fff}
.result-head{text-align:center;display:grid;gap:8px;justify-items:center;padding-block:10px;border-block:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-dim)}
.result-head h2{font-size:clamp(40px,8vw,58px)}
.desc{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.block{display:grid;gap:8px}
.block h3{font-family:var(--body);font-size:15px;font-weight:700;color:var(--pink);letter-spacing:.02em}
.block ul{margin:0;padding-left:20px;display:grid;gap:4px}
.block .lbl{font-weight:600}
.cta{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:26px;display:grid;gap:14px;text-align:center;justify-items:center}
.cta h3{font-size:clamp(28px,5vw,38px);color:var(--pink)}
.note{font-size:12px;color:var(--cream-dim)}
.adminbar{margin-top:14px;background:var(--panel-2);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.adminbar .t{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.adminbar .row{gap:8px}
.mini{appearance:none;border:1px solid var(--line);background:var(--ink);color:var(--cream);border-radius:999px;padding:7px 12px;font:600 12px/1.2 var(--body);cursor:pointer}
.mini:hover{border-color:var(--pink)}
.mini.on{border-color:var(--pink);color:var(--pink)}
.adminbar select{background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:600 12px var(--body)}
.small{font-size:12px;color:var(--cream-dim)}
footer{text-align:center;font-size:12px;color:var(--cream-dim);padding-top:36px;letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <nav class="steps" id="steps" aria-label="Quiz progress"></nav>
  <div class="bar" id="bar" aria-hidden="true"><i id="fill"></i></div>
  <div id="admin"></div>
  <main id="app"></main>
  <footer>KINGDOM ROE · COACHING &amp; CONSULTING</footer>
</div>

<script>
const CHALLENGE_URL = "";   // Flodesk link for The 8-Day Purposeful Content Shift (empty: the quiz ends with Apply)
const APPLY_URL = "https://calendly.com/d/dwcn-cp2-697";
const NAOMI_EMAIL = "naomi@kingdomroe.com";
const SHORT = {CG:"Church Girl", M:"Mystic Daughter", C:"Called Daughter"};
const NAMES = {CG:"The Church Girl", M:"The Mystic Daughter", C:"The Called Daughter"};

const Q = [
 ["A door opens: a new opportunity, and the answer is due by the end of the week. What do you do?",["I decide quickly, often within a day, and then work out how to make it happen.","I talk it over with the people I trust and wait until I have their blessing.","I sit with it until I feel something settle in my spirit. A dream, a sign, or a knowing usually tells me."],["C","CG","M"]],
 ["You've been asked to lead a group. What does your leadership look like?",["I read the atmosphere and follow the flow of the Spirit more than a plan.","I set the direction, assign the roles, and keep us moving toward the goal.","I make sure everyone feels included and cared for, even when it slows us down."],["M","C","CG"]],
 ["How does God most often speak to you?",["Through Scripture, sermons, and counsel from people I respect.","Through dreams, impressions, and symbols, a knowing I can't always explain.","Through a clear assignment, a conviction that I am to build something or fix something and move."],["CG","M","C"]],
 ["When someone you love is hurting, you…",["Feel their pain deeply, sometimes in my own body, and carry it with me for days.","Show up with whatever they need, a meal, a call, a prayer, even when it costs my own rest.","Help them see their next step and encourage them to take it."],["M","CG","C"]],
 ["Someone questions your calling or criticizes your direction. Your first reaction is…",["To weigh it quickly. If it's not from someone who has earned my ear, I keep moving.","To withdraw, process it quietly, and take it to God in prayer.","To wonder if they are right and replay what others might be thinking about me."],["C","M","CG"]],
 ["Which of these would be hardest for you?",["Disappointing the people who depend on me.","Wasting my potential, or being held back from what I know I'm built to do.","Being misunderstood or told that what I sense is not real."],["CG","C","M"]],
 ["When you picture showing up online with your calling, what holds you back?",["I'm sure of who I am. I just don't have the plan or structure to build it.","Feeling overwhelmed. I'm waiting to feel ready, or for a sign that it's time.","What my church, my family, or the people around me will think."],["C","M","CG"]]
];

const R = {
 M:{desc:"Christian Entrepreneur · Administrator",
  about:"You are a quiet force. Spiritually perceptive, deeply creative, and intuitively in tune with what others often overlook. You sense things before they are said. You carry a grace for seeing beneath the surface, and when you are anchored in God's truth, you become a gentle guide into the mysteries of His presence.",
  serve:"People coming out of spiritual darkness: seekers, creatives, the spiritually fragmented, and those doing deep inner healing who feel too broken for church.",
  offer:[["Coaching niche","Healing and Deliverance"],["Digital product","Prayer Journals"],["Physical product","Spiritual Merchandise"],["Online service","Spirituality Coach"],["In-person service","Photographer"]]},
 CG:{desc:"Social Seller · Pastor's Wife",
  about:"You have always been the dependable one. The encourager. The woman everyone calls when they need prayer, a listening ear, or a word of hope. You grew up in church, and you love God deeply. Your faith is real. Your heart is genuine. And your desire to serve is one of the most beautiful things about you.",
  serve:"Kind-hearted people who are spiritually sensitive but uncertain: new believers, those recovering from burnout and people-pleasing, and those learning their worth isn't measured by what they do.",
  offer:[["Coaching niche","Communication and Boundary Coaching"],["Digital product","Christian Video Devotionals"],["Physical product","Boxes of Blessings or Promise Card Tins"],["Online service","Virtual Bible Study Groups"],["In-person service","Event Planner"]]},
 C:{desc:"Coach · Ministry Leader",
  about:"You have always known you were set apart. The call on your life has never been a question. It is a settled knowing that lives deep in your spirit. You are bold, strategic, and built for impact. You have led through fire and survived things that would have broken others, and your resilience has inspired more people than you probably realize.",
  serve:"Gifted, ambitious people who have grown weary, seasoned overcomers ready to lead from what they've carried, and ministry-minded leaders who need both spiritual covering and strategic wisdom.",
  offer:[["Coaching niche","Faith-Based Entrepreneurship"],["Digital product","Faith-Based Webinars"],["Physical product","Journals and Notebooks"],["Online service","Leadership Coach"],["In-person service","Public Speaking Coach or Teacher"]]}
};

const S = {view:"cover", email:"", q:0, answers:Array(Q.length).fill(null), result:null, admin:false, owner:false};
const ORDER = ["cover","welcome","quiz","results"];
const STEPS = ["Welcome","Quiz","Results"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const LOCK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 1 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 1 0-4 0v2z"/></svg>';
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6 2.8 8.2l1.4-1.4 2 2 5.6-5.6 1.4 1.4z"/></svg>';

function score(){
  const t={CG:0,M:0,C:0};
  S.answers.forEach((a,i)=>{ if(a!==null) t[Q[i][2][a]]++; });
  const max=Math.max(t.CG,t.M,t.C), tied=Object.keys(t).filter(k=>t[k]===max);
  if(tied.length===1) return tied[0];
  const q7=Q[6][2][S.answers[6]];
  if(tied.includes(q7)) return q7;
  const q1=S.answers[0]===null?null:Q[0][2][S.answers[0]];
  return tied.includes(q1) ? q1 : tied[0];
}

function setSteps(){
  const idx=ORDER.indexOf(S.view);
  $("#steps").innerHTML=STEPS.map((l,i)=>{const si=i+1,c=si<idx?"done":si===idx?"current":"";return `<span class="step ${c}">${si<idx?CHECK:si>idx?LOCK:""}${l}</span>`;}).join("");
  const done=S.answers.filter(a=>a!==null).length;
  $("#fill").style.width=({cover:0,welcome:8,quiz:10+Math.round(75*done/Q.length),results:100})[S.view]+"%";
  $("#steps").hidden=$("#bar").hidden=S.view==="cover";
}
function go(v){S.view=v;render();window.scrollTo({top:0});}
function enterAdmin(){ S.admin=true; if(!S.email) S.email=NAOMI_EMAIL; go(S.view==="cover"?"welcome":S.view); }
function renderAdmin(){
  const box=document.getElementById("admin");
  if(!S.admin){
    box.innerHTML = S.owner && S.view==="cover" ? `<div class="adminbar"><p class="t">You own this quiz</p><div class="row"><button class="mini" id="adOpen">Open Review Mode</button></div></div>` : "";
    const b=document.getElementById("adOpen"); if(b) b.onclick=enterAdmin; return;
  }
  const v=S.view;
  box.innerHTML=`<div class="adminbar">
    <p class="t">Review Mode · Only you see this · Every page is unlocked</p>
    <div class="row">
      <button class="mini ${v==="cover"?"on":""}" data-go="cover">Cover</button>
      <button class="mini ${v==="welcome"?"on":""}" data-go="welcome">Welcome</button>
      <button class="mini ${v==="quiz"?"on":""}" data-go="quiz">Questions</button>
      <select id="adQ" aria-label="Jump to question">${Q.map((q,i)=>`<option value="${i}" ${v==="quiz"&&S.q===i?"selected":""}>Question ${i+1}</option>`).join("")}</select>
    </div>
    <div class="row"><span class="small">Preview results:</span>
      ${["CG","M","C"].map(k=>`<button class="mini ${v==="results"&&S.result===k?"on":""}" data-res="${k}">${SHORT[k]}</button>`).join("")}
      <button class="mini" id="adExit">Exit Review Mode</button>
    </div></div>`;
  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  box.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{S.result=b.dataset.res;go("results");});
  document.getElementById("adQ").onchange=e=>{S.q=+e.target.value;go("quiz");};
  document.getElementById("adExit").onclick=()=>{S.admin=false;go("cover");};
}
(async()=>{ try{ const u = window.claude && claude.use ? await claude.use("user") : null; if(u && await u.isOwner()){ S.owner=true; renderAdmin(); } }catch(e){} })();

function vCover(){return `<section class="cover">
  <img src="cover.jpg" alt="Which Daughter Are You? Mini Quiz. Discover your spiritual identity, who you're called to serve, and what you offer.">
  <ul class="inside">
    <li>Your Spiritual Daughter Archetype</li>
    <li>Who you're called to serve</li>
    <li>Five services and products that fit your identity and your gifts</li>
  </ul>
  <form class="panel" id="f" novalidate>
    <label class="f" for="em">Enter your email to begin<input type="email" id="em" autocomplete="email" value="${esc(S.email)}"></label>
    <p class="err" id="err" role="alert"></p>
    <div class="row center"><button class="btn" type="submit">Let's Get Started</button></div>
  </form></section>`;}

function vWelcome(){return `<section class="page">
  <h2>Which Daughter Are You?</h2>
  <div class="copy">
    <p class="lede">Discover your spiritual identity, so you can step into your God-given assignment with confidence.</p>
    <p>You have the gift. You have the expertise. What you may not have is clarity on how to package it.</p>
    <p>Maybe you know you're called, but you couldn't tell anyone exactly who you're called to. Maybe people already come to you for wisdom, prayer, and answers, and you've never been shown what to offer an online audience. You're not missing the anointing. You're missing the direction.</p>
    <p>Your gifts can be packaged. Your expertise can be packaged. The question is how, and for whom. That's what this quiz settles.</p>
    <p>In just a few minutes, you'll discover three things:</p>
    <ol>
      <li><strong>Your spiritual identity.</strong> This is the foundation for how you move, how you act, and how you show up in the marketplace. Until you know who you are, you'll keep speaking as someone you're not.</li>
      <li><strong>Who you're called to serve.</strong> Not everybody. The type of person God assigned to you.</li>
      <li><strong>What to offer them.</strong> Services and products that fit your identity and your gifts, online or in person, so you can stop guessing and start building.</li>
    </ol>
    <p>There are three Daughters: The Mystic Daughter, The Church Girl, and The Called Daughter. One of them is you.</p>
    <p>Take your time. Choose the answer that sounds most like you, not the one that sounds most spiritual. Answer from who you are today, not from who you think you should be.</p>
  </div>
  <div class="row"><button class="btn" id="start">Start the Quiz</button></div></section>`;}

function vQuiz(){const i=S.q,[t,o]=Q[i],sel=S.answers[i];return `<section class="page">
  <p class="qnum">Question ${i+1} of ${Q.length}</p>
  <h2 class="qtext">${esc(t)}</h2>
  <div style="display:grid;gap:10px">${o.map((x,k)=>`<button class="choice" data-a="${k}" aria-pressed="${sel===k}"><span class="k">${"ABC"[k]}</span><span>${esc(x)}</span></button>`).join("")}</div>
  <div class="row between"><button class="btn ghost" id="back">${i===0?"Back":"Back"}</button><button class="btn" id="next" ${sel===null&&!S.admin?"disabled":""}>${i===Q.length-1?"See My Results":"Next"}</button></div></section>`;}

function vResults(){const d=R[S.result];return `<section class="page">
  <div class="copy">
    <p class="lede">Blessings, woman of God.</p>
    <p>You've completed the quiz, and I'm honored to share your results. But first, I want you to know that you are in the right place.</p>
    <p>The women I work with typically come from the same fields as you: healthcare, education, mental health, ministry leadership, or a home-based business of their own. Different callings, different careers, and yet the same invitation. God is calling each of them into the online space, to serve through a service or to step into the role of a coach.</p>
    <p>As you begin this journey, remember that your identity matters. How you function, and the way you perceive things spiritually, will shape how you show up. So here are your results.</p>
  </div>
  <div class="result-head"><p class="eyebrow">Your Spiritual Daughter Archetype Is</p><h2>${NAMES[S.result]}</h2><p class="desc">${d.desc}</p></div>
  <p>${esc(d.about)}</p>
  <div class="block"><h3>Who You're Called to Serve</h3><p>${esc(d.serve)}</p></div>
  <div class="block"><h3>What You Can Offer, Online or In Person</h3><p>You can build your offer online, in person, or both. Here is one place to begin in each area:</p>
    <ul>${d.offer.map(o=>`<li><span class="lbl">${o[0]}:</span> ${esc(o[1])}</li>`).join("")}</ul></div>
  ${CHALLENGE_URL?`<div class="cta">
    <p class="eyebrow">Your Next Step</p>
    <h3>Shift Your Content From Encouragement to Attraction.</h3>
    <p>Now that you know who you are and who you're called to serve, it's time to show up for her. Stop posting just for encouragement and start attracting the people God has called you to. In eight days, you'll learn how to turn every post into an invitation, so the women who already love what you share know exactly how to work with you.</p>
    <a class="btn" href="${CHALLENGE_URL}" target="_blank" rel="noopener">Join The 8-Day Purposeful Content Shift™</a>
  `:`<div class="cta">
    <p class="eyebrow">Your Next Step</p>
    <h3>You Know Who You Are. Now Let's Build It.</h3>
    <p>Now that you know your results, you know your potential. Maybe you already offer a service, and you're ready to bring it to the marketplace. Or maybe you've been working hard to build your coaching business, and your income has stayed at the same level.</p>
    <p>If you're ready to take your coaching to the next level, I want to show you The Called Method™, the method I used to 5X my monthly income. Let me help you position yourself as an expert, a confident woman of God who does not have to compromise her calling or her anointing to build impact and income.</p>
    <a class="btn" href="${APPLY_URL}" target="_blank" rel="noopener">Apply to Work With Me</a>
    <p class="note">Individual experiences and results vary.</p>
  `}  </div></section>`;}

function render(){
  setSteps();
  renderAdmin();
  const app=$("#app");
  app.innerHTML=({cover:vCover,welcome:vWelcome,quiz:vQuiz,results:vResults})[S.view]();
  if(S.view==="cover") $("#f").onsubmit=e=>{e.preventDefault();S.email=$("#em").value.trim();
    if(S.email.toLowerCase()===NAOMI_EMAIL){enterAdmin();return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email)){$("#err").textContent="Please enter a valid email address.";return;} go("welcome");};
  if(S.view==="welcome") $("#start").onclick=()=>{S.q=0;go("quiz");};
  if(S.view==="quiz"){
    app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.answers[S.q]=+b.dataset.a;app.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#next").disabled=false;setSteps();});
    $("#back").onclick=()=>{if(S.q===0)go("welcome");else{S.q--;render();}};
    $("#next").onclick=()=>{if(S.answers[S.q]===null&&!S.admin)return;if(S.q<Q.length-1){S.q++;render();}else{S.result=score();go("results");}};
  }
}
render();
</script>

</body>
</html>
