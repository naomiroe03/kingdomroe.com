/* ---------- state ---------- */
const S = {view:"cover", name:"", email:"", program:"", q:0, answers:Array(Q.length).fill(null), sent:false, result:null, scores:null, finishedAt:null, admin:false, owner:false};
const STEPS = [["welcome","Welcome"],["quiz","Assessment"],["send","Send Results"],["results","Your Results"]];
const ORDER = ["cover","welcome","quiz","send","results","next"];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const LOCK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 1 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 1 0-4 0v2z"/></svg>';
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6 2.8 8.2l1.4-1.4 2 2 5.6-5.6 1.4 1.4z"/></svg>';

function score(){
  const t = {CG:0,M:0,C:0};
  S.answers.forEach((a,i)=>{ if(a!==null) t[Q[i][2][a]]++; });
  const max = Math.max(t.CG,t.M,t.C);
  const tied = Object.keys(t).filter(k=>t[k]===max);
  let win = tied[0];
  if(tied.length>1){
    const pick = i => Q[i][2][S.answers[i]];
    const tb = pick(15);
    if(tied.includes(tb)) win = tb;
    else for(let i=0;i<Q.length;i++){ const d=pick(i); if(tied.includes(d)){ win=d; break; } }
  }
  return {t, win};
}

function setSteps(){
  const idx = ORDER.indexOf(S.view);
  $("#steps").innerHTML = STEPS.map(([k,label],i)=>{
    const si = i+1, cls = si<idx ? "done" : si===idx ? "current" : "";
    const icon = si<idx ? CHECK : si>idx ? LOCK : "";
    return `<span class="step ${cls}">${icon}${label}</span>`;
  }).join("");
  let pct = 0;
  if(S.view==="welcome") pct = 6;
  if(S.view==="quiz") pct = 8 + Math.round(64 * (S.answers.filter(a=>a!==null).length / Q.length));
  if(S.view==="send") pct = 76;
  if(S.view==="results") pct = 100;
  if(S.view==="next") pct = 100;
  $("#barfill").style.width = pct + "%";
  $("#steps").hidden = S.view==="cover";
  document.querySelector(".bar").hidden = S.view==="cover";
}

function go(v){ S.view = v; render(); window.scrollTo({top:0}); }

/* ---------- review mode (Naomi only) ---------- */
function enterAdmin(){
  S.admin = true;
  if(!S.name) S.name = "Naomi";
  if(!S.email) S.email = NAOMI_EMAIL;
  if(!S.program) S.program = "session";
  if(!S.finishedAt) S.finishedAt = new Date().toLocaleString(undefined,{dateStyle:"long",timeStyle:"short"});
  go(S.view==="cover" ? "welcome" : S.view);
}
function previewResult(k){
  const {t} = score(); S.scores = t; S.result = k;
  if(!S.finishedAt) S.finishedAt = new Date().toLocaleString(undefined,{dateStyle:"long",timeStyle:"short"});
  go("results");
}
function renderAdmin(){
  const box = document.getElementById("admin");
  if(!S.admin){
    box.innerHTML = S.owner && S.view==="cover" ? `<div class="adminbar"><p class="t">You own this assessment</p><div class="row"><button class="mini" id="adOpen">Open Review Mode</button></div></div>` : "";
    const b = document.getElementById("adOpen"); if(b) b.onclick = enterAdmin;
    return;
  }
  const v = S.view;
  box.innerHTML = `<div class="adminbar">
    <p class="t">Review Mode · Only you see this · Every page is unlocked</p>
    <div class="row">
      <button class="mini ${v==="cover"?"on":""}" data-go="cover">Cover</button>
      <button class="mini ${v==="welcome"?"on":""}" data-go="welcome">Welcome</button>
      <button class="mini ${v==="quiz"?"on":""}" data-go="quiz">Questions</button>
      <select id="adQ" aria-label="Jump to question">${Q.map((q,i)=>`<option value="${i}" ${v==="quiz"&&S.q===i?"selected":""}>Question ${i+1}${q[3]?" (spiritual)":""}</option>`).join("")}</select>
      <button class="mini ${v==="send"?"on":""}" data-go="send">Send Results</button>
    </div>
    <div class="row">
      <span class="small">Preview results:</span>
      ${["CG","M","C"].map(k=>`<button class="mini ${v==="results"&&S.result===k?"on":""}" data-res="${k}">${SHORT[k]}</button>`).join("")}
      <button class="mini" id="adExit">Exit Review Mode</button>
    </div>
  </div>`;
  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g = b.dataset.go;
    if(g==="send" && !S.result){ const {t,win}=score(); S.scores=t; S.result=win; }
    go(g);
  });
  box.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>previewResult(b.dataset.res));
  document.getElementById("adQ").onchange = e=>{ S.q = +e.target.value; go("quiz"); };
  document.getElementById("adExit").onclick = ()=>{ S.admin=false; go("cover"); };
}
(async()=>{
  try{
    const u = window.claude && claude.use ? await claude.use("user") : null;
    if(u && await u.isOwner()){ S.owner = true; renderAdmin(); }
  }catch(e){}
})();

  h += area(++n,"Your Purpose Statement Starter", `<p class="lede">${esc(d.purpose)}</p>`);
  h += area(++n,"Where to Show Up", `<p>${esc(d.where)}</p>`);
  h += area(++n,"How You're Meant to Show Up", `<p><span class="label">Your communicator type: ${esc(d.show[0])}.</span> ${esc(d.show[1])}</p><ol>${d.show[2].map(v=>`<li><span class="label">${esc(v[0])}:</span> ${esc(v[1])}</li>`).join("")}</ol>`);
  h += area(++n,"Your Next Steps", `<div class="letter"><span class="sal">${esc(d.letter[0])}</span>${esc(d.letter[1])}</div>`);
  return `<section class="page">
    <div class="copy"><p class="lede">Blessings, ${esc(S.name.split(" ")[0]||"woman of God")}. Here is who God made you to be in the marketplace.</p></div>
    <div class="result-head">
      <p class="eyebrow">Your Spiritual Daughter Archetype Is</p>
      <h2>${NAMES[S.result]}</h2>
      <p class="desc">${esc(d.desc)}</p>
      <div class="scores">${chips}</div>
    </div>
    ${h}
    <div class="row center" style="padding-top:8px">
      <button class="btn ghost" id="dl" hidden>Download My Results</button>
    </div>
    <div class="letter" style="text-align:center;display:grid;gap:14px;justify-items:center">
      <span class="sal" style="font-size:30px;font-style:normal;font-weight:700">You Know Who You Are. Now Let's Build It.</span>
      <p style="font-family:var(--body);font-size:15px">Apply to work with me. You'll answer a few short questions and choose a time for a 20-minute call with me, so we can talk about your next step.</p>
      <a class="btn" href="${APPLY_URL}" target="_blank" rel="noopener">Apply to Work With Me</a>
    </div>
    <p class="note" id="dlMsg" role="status" style="text-align:center"></p>
  </section>`;
}

function vNext(){
  if(S.program==="session"){
    return `<section class="page end">
      <h2>You Know Who You Are. Now Let's Build It.</h2>
      <div class="copy" style="text-align:left">
        <p>Your results are with me, and I'll study them before our strategy session. Bring your results with you.</p>
        <p>Your strategy session will give you your niche, your purpose statement and the questions your ideal client is already asking. When you're ready to build the full offer, launch it and sell it, that work happens inside The Called Method™ 6-Month Cohort.</p>
        <p>Apply now. You'll answer a few short questions and choose a time for a 20-minute call with me, so we can talk about your next step.</p>
      </div>
      <div class="row center">${APPLY_URL?`<a class="btn" href="${APPLY_URL}" target="_blank" rel="noopener">Apply to Work With Me</a>`:`<span class="btn off" aria-disabled="true">Apply to Work With Me</span>`}</div>
      ${APPLY_URL?"":`<p class="note">The application link is coming soon.</p>`}
      <div class="row center"><button class="btn ghost" id="backRes">Back to My Results</button></div>
    </section>`;
  }
  return `<section class="page end">
    <h2>Keep Building, Woman of God.</h2>
    <div class="copy" style="text-align:left">
      <p>Your results are with me, and I'll use them to guide you through our six months together.</p>
      <p>Bring this page with you, and come ready to build on everything God has already placed inside of you.</p>
    </div>
    <div class="row center"><button class="btn ghost" id="backRes">Back to My Results</button></div>
  </section>`;
}

/* ---------- render + wiring ---------- */
function render(){
  setSteps();
  renderAdmin();
  const app = $("#app");
  app.innerHTML = ({cover:vCover, welcome:vWelcome, quiz:vQuiz, send:vSend, results:vResults, next:vNext})[S.view]();

  if(S.view==="cover"){
    app.querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>{
      S.name=$("#nm").value; S.email=$("#em").value; S.program=b.dataset.prog;
      app.querySelectorAll("[data-prog]").forEach(x=>x.setAttribute("aria-pressed", x===b));
    });
    $("#coverForm").onsubmit = e=>{
      e.preventDefault();
      S.name=$("#nm").value.trim(); S.email=$("#em").value.trim();
      if(S.email.toLowerCase()===NAOMI_EMAIL){ enterAdmin(); return; }
      const err=$("#coverErr");
      if(!S.name) return err.textContent="Please enter your name.";
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email)) return err.textContent="Please enter a valid email address.";
      if(!S.program) return err.textContent="Please choose which program you're taking this assessment for.";
      go("welcome");
    };
  }
  if(S.view==="welcome") $("#start").onclick=()=>{ S.q=0; go("quiz"); };
  if(S.view==="quiz"){
    app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      S.answers[S.q]=+b.dataset.a;
      app.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      $("#next").disabled=false; setSteps();
    });
    $("#back").onclick=()=>{ if(S.q===0) go("welcome"); else { S.q--; render(); } };
    $("#next").onclick=()=>{
      if(S.answers[S.q]===null && !S.admin) return;
      if(S.q<Q.length-1){ S.q++; render(); }
      else {
        const {t,win}=score(); S.scores=t; S.result=win;
        S.finishedAt=new Date().toLocaleString(undefined,{dateStyle:"long",timeStyle:"short"});
        go("send");
      }
    };
  }
  if(S.view==="send"){
    const copy=(txt,msg)=>{
      const done=()=>{$("#copyMsg").textContent=msg;};
      try{ navigator.clipboard.writeText(txt).then(done,()=>{ $("#resultsBox").select(); $("#copyMsg").textContent="Press Ctrl+C or Cmd+C to copy."; }); }
      catch(e){ $("#resultsBox").select(); $("#copyMsg").textContent="Press Ctrl+C or Cmd+C to copy."; }
    };
    $("#copyAddr").onclick=()=>copy(NAOMI_EMAIL,"Address copied.");
    $("#copyRes").onclick=()=>copy($("#resultsBox").value,"Results copied.");
    $("#sentBox").onchange=e=>{ S.sent=e.target.checked; $("#openRes").disabled=!S.sent; };
    $("#openRes").onclick=()=>{ if(S.sent||S.admin) go("results"); };
  }
  if(S.view==="results"){
    setupDownload();
  }
  if(S.view==="next") $("#backRes").onclick=()=>go("results");
}

let downloads = null;
async function setupDownload(){
  try{ if(!downloads && window.claude && claude.use) downloads = await claude.use("downloads"); }catch(e){ downloads=null; }
  const b = document.getElementById("dl"); if(!b) return;
  if(!downloads){ b.hidden=true; return; }
  b.hidden=false;
  b.onclick = async ()=>{
    const d=R[S.result], msg=document.getElementById("dlMsg");
    const parts=[`THE SPIRITUAL DAUGHTER ARCHETYPE ASSESSMENT`,`${S.name} · ${S.finishedAt}`,``,`Your Spiritual Daughter Archetype: ${NAMES[S.result]} (${d.desc})`,``,d.identity,``,
      `SPIRITUAL GIFT CATEGORIES`,...d.cats.map(c=>`- ${c[0]}: ${c[1]}`),`Your spiritual gifts: ${d.gifts}`,``,
      `CRISIS SELF IN BUSINESS`,...d.crisis.map(x=>"- "+x),``,`HIGHER SELF IN BUSINESS`,...d.higher.map(x=>"- "+x),``,
      `STRENGTHS`,...d.strengths.map(x=>"- "+x),``,`GROWTH AREAS`,...d.growth.map(x=>"- "+x),``,`ZONE OF GENIUS`,d.genius,``,
      `MARKETPLACE GIFTS`,...d.market.map(r=>`- ${r[0]}: ${r[1]}. Ideas: ${r[2]}. Services: ${r[3]}. Action step: ${r[4]}.`),``,
      `OFFER OPTIONS`,...Object.entries(d.offers).map(([k,v])=>`${k}: ${v}`),``,`MARKETPLACE MATCH: ${d.match[0]}`,d.match[1],``,
      `WHO YOU'RE CALLED TO SERVE`,d.serve[0],...d.serve[1].map(x=>"- "+x),`Her core personality: ${d.serve[2]}`,``,
      `PURPOSE STATEMENT STARTER`,d.purpose,``,`WHERE TO SHOW UP`,d.where,``,`HOW YOU'RE MEANT TO SHOW UP: ${d.show[0]}`,...d.show[2].map(v=>`- ${v[0]}: ${v[1]}`),``,
      d.letter[0],d.letter[1]];
    try{ await downloads.save({filename:`Spiritual Daughter Results - ${S.name||"My Results"}.txt`, data:parts.join("\n")}); msg.textContent="Your results were saved."; }
    catch(e){ msg.textContent = e && e.code==="declined" ? "" : "Saving isn't available here. You can copy your results from the Send step."; }
  };
}

render();
</script>
